# electron-builder 打包配置
#
# 注意：构建过程要搬运/删除 Electron.app 里的几万个文件，必须在**普通终端**执行：
#   npm run dist:mac
# 在受限沙箱（文件写入被代理拦截）里会以 "Invalid package …/default_app.asar" 失败。
# 打包前先跑 `npm run pack:check`（也会随 npm test 自动跑），它会拦下缺图标、
# 漏 files 白名单、node-pty 没 unpack、把运行时依赖错放 devDependencies 这类
# 「能构建但起不来」的问题。
appId: cn.workbuddy.hermes-desktop
productName: Hermes Desktop Client
copyright: MIT

# 直接用 devDependency 里已解压的 Electron，避免每次打包都从 GitHub 下载二进制
# （离线 / 内网环境否则会卡在下载）。删掉这行则回退到按 version 下载。
electronDist: node_modules/electron/dist

directories:
  output: release
  buildResources: build

files:
  - main/**/*
  - preload/**/*
  - renderer/**/*
  - package.json
  - "!**/*.map"

# node-pty 1.1.0 自带 NAPI prebuilds（darwin-x64 / darwin-arm64 / win32-*），NAPI 是与
# ABI 无关的稳定接口，同一个 .node 在 Node 22 和 Electron 33 下都能加载（实测 ABI 130
# 下 spawn 正常）。所以**关掉重编译**：
#   1) 重编译要 python3 + node-gyp，Python 3.12+ 移除了 distutils，node-gyp 直接报
#      "No module named 'distutils'"，机器上有没有编译链不该决定能不能出包；
#   2) 编出来的产物和 prebuilds 功能等价，白等一次几分钟的编译。
# 换 node-pty 大版本或换平台后要重新确认 prebuilds 目录还在（check-package.js 会拦）。
npmRebuild: false
asar: true
asarUnpack:
  - "**/node_modules/node-pty/**"

mac:
  category: public.app-category.developer-tools
  # 不写 arch：默认只打**当前机器**的架构。原因见上面 electronDist —— 本地只有一份
  # 架构的 Electron，写 arch: [arm64, x64] 时 electron-builder 不会去下载另一份，而是
  # 把同一份 x64 Electron.app 复制成 -arm64.dmg（实测文件名 arm64、二进制 x86_64），
  # 在 Apple Silicon 上不装 Rosetta 根本打不开。要出双架构就先装对应 Electron：
  #   npm i -D electron@33.4.11 --arch=arm64 && npx electron-builder --mac --arm64
  # scripts/dist.js 会在架构对不上时直接拦下，不生成假包。
  target:
    - target: dmg
  identity: null            # 本地开发不分发；正式分发需开发者证书
  darkModeSupport: true

win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-Setup-${version}.${ext}

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true

linux:
  target:
    - AppImage
    - deb
  category: Development
  maintainer: dev@example.com
